    <path d="M56 50 L84 36 L84 72 L56 86 Z" fill="url(#gSide)"/>
    <path d="M16 42 L44 28 L84 36 L56 50 Z" fill="url(#gTop)"/>

    <!-- крышка: светлая полоса и тень под ней -->
    <path d="M16 42 L56 50 L56 59 L16 51 Z" fill="#fff" opacity=".14"/>
    <path d="M56 50 L84 36 L84 45 L56 59 Z" fill="#fff" opacity=".08"/>
    <path d="M16 51 L56 59 L56 62.5 L16 54.5 Z" fill="#000" opacity=".2"/>
    <path d="M56 59 L84 45 L84 48.5 L56 62.5 Z" fill="#000" opacity=".2"/>

    <!-- лента на передней грани -->
    <path d="M33.2 45.4 L38.8 46.6 L38.8 82.6 L33.2 81.4 Z" fill="url(#rV)"/>
    <!-- лента на правой грани -->
    <path d="M68.04 44 L71.96 42 L71.96 78 L68.04 80 Z" fill="url(#rS)"/>
    <!-- ленты на крышке -->
    <path d="M28.04 36 L31.96 34 L71.96 42 L68.04 44 Z" fill="url(#rT)"/>
    <path d="M33.2 45.4 L38.8 46.6 L66.8 32.6 L61.2 31.4 Z" fill="url(#rT)"/>

