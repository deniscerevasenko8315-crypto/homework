<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 100 100" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE690"/><stop offset="1" stop-color="#F4BC3C"/>
    </linearGradient>
    <linearGradient id="gFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7C945"/><stop offset="1" stop-color="#C98E1E"/>
    </linearGradient>
    <linearGradient id="gSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C99021"/><stop offset="1" stop-color="#8A5E10"/>
    </linearGradient>
    <linearGradient id="rV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9564C"/><stop offset="1" stop-color="#B0302A"/>
    </linearGradient>
    <linearGradient id="rS" x1="0" y1="0" x2="0" y2="1">
