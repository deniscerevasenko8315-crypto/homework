    <path d="M16 42 L44 28 L84 36" stroke="#fff" stroke-opacity=".75" stroke-width="1" stroke-linejoin="round"/>
    <path d="M16 42 L56 50 L84 36" stroke="#fff" stroke-opacity=".3" stroke-width=".8" stroke-linejoin="round"/>
    <path d="M56 50 V86" stroke="#000" stroke-opacity=".2" stroke-width=".8"/>
    <path d="M16 42 V78" stroke="#fff" stroke-opacity=".3" stroke-width=".8"/>

    <!-- хвостики банта -->
    <path d="M47 41 L38 54 L44 55 L51 45 Z" fill="#B82F28"/>
    <path d="M53 41 L62 51 L56 53 L49 45 Z" fill="#C93A32"/>

    <!-- петли банта -->
    <path d="M50 38 C38 12 18 22 29 36 C35 43 45 43 50 38 Z" fill="url(#bowL)"/>
    <path d="M48.5 38 C40 23 30 26 33.5 34.5 C37 39.5 43 40.5 48.5 38 Z" fill="#B82F28" opacity=".55"/>
    <path d="M50 38 C62 12 82 22 71 36 C65 43 55 43 50 38 Z" fill="url(#bowR)"/>
    <path d="M51.5 38 C60 23 70 26 66.5 34.5 C63 39.5 57 40.5 51.5 38 Z" fill="#8E221D" opacity=".5"/>
    <path d="M27 26 C31 22 37 22 41 27" stroke="#fff" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M73 26 C69 22 63 22 59 27" stroke="#fff" stroke-opacity=".4" stroke-width="1.2" stroke-linecap="round"/>

    <!-- узел -->
    <ellipse cx="50" cy="39" rx="6" ry="5" fill="#D8453D"/>
    <path d="M45 37.5 C47 35 53 35 55 37.5" stroke="#FF9A90" stroke-opacity=".8" stroke-width="1" stroke-linecap="round"/>
