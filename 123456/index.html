<!doctype html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/index.css" />
    <link
      rel="shortcut icon"
      href="./icon/logo-64x64.ico"
      type="image/x-icon"
    />
    <title>LEADER CLASSIC</title>
  </head>
  <body class="page__body">
    <header class="header">
      <div class="container header__container">
        <a class="logo header__logo" href="">
          <img
            class="logo__img"
            src="./icon/logo-combined.svg"
            width="52px"
            height="66px"
            alt="Логотип Leader classic"
          />
          <span class="logo__span"
            ><span>LEADER</span> <span>CLASSIC</span></span
          >
        </a>
        <nav
          class="menu header__menu"
          id="header__menu"
          aria-label="Главное меню"
        >
          <ul class="menu__list">
            <li class="menu__item">
              <a class="menu__link" href="#">
                <img
                  class="link__img"
                  src="./icon/language-ru.svg"
                  width="23px"
                  height="23px"
                  alt="Выбран Русский язык" />RU
                <img
                  class="link__img-arrow"
                  width="22px"
                  height="22px"
                  src="./icon/down-arrow.svg"
                  alt="выбран Русский язык"
              /></a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#">Тарифы</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#">Бонусы</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#">Реферальная</a>
            </li>
            <li class="menu__item">
              <a class="menu__link" href="#">Контакты</a>
            </li>
          </ul>
        </nav>
        <div class="header__controls">
          <button class="button-stroke">Войти</button>
          <button class="orange-button">Открыть счёт</button>
        </div>
      </div>
    </header>
  </body>
</html>
